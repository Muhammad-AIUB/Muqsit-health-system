name: Deploy

on:
  push:
    branches:
      - main

jobs:
  # ⚠️ THE GATE. `deploy` below `needs: test`, so a push to main whose tests fail
  # deploys NOTHING: production stays on the last good commit and this run goes
  # red. Never remove `needs: test`, and never add a way around it, without the
  # owner's say (docs/rules/deploy-and-ops.md). The tests are test.yml, the same
  # as for a pull request. This job is given no secrets: the VPS key is only
  # named in the `deploy` job.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # One deploy at a time: a second push waits for the one on the box instead of
    # running over it (a waiting one is replaced by a newer push, which holds it).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy to VPS over SSH
        # ⚠️ PINNED TO A COMMIT SHA ON PURPOSE — never go back to `@v1.0.3`.
        # A tag is mutable: whoever controls this action's repo can move it, and
        # the next push to main would hand `secrets.VPS_KEY` (root SSH to the box
        # holding every patient record) to whatever that commit runs. That is
        # exactly how tj-actions/changed-files leaked secrets from ~23k repos in
        # March 2025. Re-pin deliberately when upgrading:
        #   gh api repos/appleboy/ssh-action/git/ref/tags/<tag> --jq .object.sha
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /root/muqsit
            # npm install regenerates package-lock.json with platform-specific
            # entries on the VPS, leaving these files locally modified and
            # blocking the next pull. They're safely discarded — npm install
            # right below regenerates them anyway.
            git checkout -- client/package-lock.json server/package-lock.json admin/package-lock.json 2>/dev/null || true
            # ⚠️ --ff-only, and NEVER `git reset --hard origin/main` to "fix" a failure
            # here. When main's history is rewritten (a force push) the box's clone is
            # not an ancestor of it, and this step stops the deploy BEFORE any build or
            # restart: the three runs of 2026-11-06 (20e80cc, 834005b, 3f9699f, all
            # pushed by another account) died exactly here with "divergent branches",
            # which left production on the last good commit while the pushed history
            # carried a hidden payload (`init` files + `node init &&` in the build
            # scripts). A reset would have built and run it. Fix the HISTORY on origin
            # (root CLAUDE.md, "merge commit"), not this line.
            # It deploys exactly the commit that PASSED the tests (github.sha), not
            # whatever main is by now: a push that lands while the tests run waits for
            # its own tests. `merge --ff-only <sha>` keeps the --ff-only rule (it stops,
            # never merges or resets, when the box has diverged) and does nothing on a
            # box already at that commit.
            git fetch origin main
            git merge --ff-only ${{ github.sha }}
            # ⚠️ Each build runs in a SUBSHELL, so that a failed step STOPS the
            # script before `pm2 restart all` and this Action goes red. Until
            # 2026-10-16 they were written `cd client && … && npm run build && cd ..`,
            # and a failed build did not stop anything: `set -e` ignores a failure
            # inside an && list, so the script carried on from the wrong directory,
            # skipped the builds after it, restarted everything onto the failed one
            # and reported success. The API is built first: a failure there leaves
            # the doctor app's build untouched and nothing restarted. A red run
            # is still NOT safe: `next build` empties `.next` and `nest build`
            # empties `dist` before compiling, so the running app may already be
            # missing files — fix or revert at once (root CLAUDE.md, Deploy).
            (cd server && npm install && npx prisma generate && npm run build)
            (cd client && npm install && npm run build)
            # Admin build is non-fatal so it can never block the core client/server deploy.
            (cd admin && npm install && npm run build) || echo "admin build failed — continuing"
            pm2 restart all
