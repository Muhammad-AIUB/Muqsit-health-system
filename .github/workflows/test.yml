name: Test

# Runs on pull requests and on demand. It does NOT run on push to main and
# deploy.yml does not depend on it — gating the deploy on this workflow is an
# owner decision (it changes how production ships), not something this file
# turns on by itself.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pinned to commit SHAs, like deploy.yml — a tag is mutable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: server
      - run: npm test -- --coverage
        working-directory: server
      # The build output must stay at dist/main.js (see server/CLAUDE.md).
      - run: npm run build && test -f dist/main.js
        working-directory: server
      - run: docker compose -f docker-compose.test.yml up -d --wait
      - run: npm run test:db
        working-directory: server
      - run: npm run test:int
        working-directory: server

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npx tsc --noEmit
        working-directory: client
      - run: npm run test:cov
        working-directory: client
